<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker>
  </defs>
  <rect width="1200" height="700" rx="16" fill="#ffffff"/>

  <!-- column titles -->
  <text x="190" y="52" text-anchor="middle" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1">YOUR CODING AGENT</text>
  <text x="600" y="52" text-anchor="middle" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1">CARDLOOM (MCP SERVER)</text>
  <text x="1010" y="52" text-anchor="middle" font-size="15" font-weight="700" fill="#64748b" letter-spacing="1">STORED IN GIT</text>

  <!-- agent boxes -->
  <g font-size="20" font-weight="600" fill="#0f172a">
    <rect x="50" y="80" width="280" height="76" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="190" y="125" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18">search_knowledge</text>
    <rect x="50" y="200" width="280" height="76" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="190" y="245" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18">report_card_usage</text>
    <rect x="50" y="320" width="280" height="76" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="190" y="365" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18">save_learning_draft</text>
  </g>

  <!-- cardloom boxes -->
  <g fill="#0f172a">
    <rect x="450" y="80" width="300" height="76" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="600" y="112" text-anchor="middle" font-size="18" font-weight="600">Verified cards</text>
    <text x="600" y="136" text-anchor="middle" font-size="15" fill="#475569">each with a “match” label</text>
    <rect x="450" y="200" width="300" height="76" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="600" y="232" text-anchor="middle" font-size="18" font-weight="600">Usage feedback</text>
    <text x="600" y="256" text-anchor="middle" font-size="15" fill="#475569">confirmed · refuted · neutral</text>
    <rect x="450" y="320" width="300" height="76" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="600" y="352" text-anchor="middle" font-size="18" font-weight="600">New card</text>
    <text x="600" y="376" text-anchor="middle" font-size="15" fill="#475569">always saved as a draft</text>
  </g>

  <!-- store boxes -->
  <g fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16">
    <rect x="870" y="200" width="280" height="76" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="1010" y="244" text-anchor="middle">events/&lt;machine&gt;.jsonl</text>
    <rect x="870" y="320" width="280" height="76" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="1010" y="364" text-anchor="middle">cards/&lt;id&gt;.md</text>
    <rect x="870" y="80" width="280" height="76" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="1010" y="112" text-anchor="middle">cards/*.md</text>
    <text x="1010" y="136" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#475569">read through a derived index</text>
  </g>

  <!-- arrows agent -> cardloom -->
  <g stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <line x1="332" y1="118" x2="446" y2="118"/>
    <line x1="332" y1="238" x2="446" y2="238"/>
    <line x1="332" y1="358" x2="446" y2="358"/>
  </g>
  <!-- cardloom -> store -->
  <g stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <line x1="752" y1="238" x2="866" y2="238"/>
    <line x1="752" y1="358" x2="866" y2="358"/>
  </g>
  <line x1="866" y1="118" x2="752" y2="118" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- divider -->
  <line x1="50" y1="440" x2="1150" y2="440" stroke="#e2e8f0" stroke-width="2"/>
  <text x="50" y="484" font-size="18" font-weight="700" fill="#0f172a">A card’s life — you decide, with <tspan font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16">update_card_status</tspan></text>

  <!-- lifecycle -->
  <g font-size="22" font-weight="700" text-anchor="middle">
    <rect x="50" y="520" width="260" height="96" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="180" y="560" fill="#92400e">draft</text>
    <text x="180" y="588" font-size="15" font-weight="400" fill="#475569">hidden from search unless asked</text>

    <rect x="470" y="520" width="260" height="96" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
    <text x="600" y="560" fill="#166534">verified</text>
    <text x="600" y="588" font-size="15" font-weight="400" fill="#475569">returned by default</text>

    <rect x="890" y="520" width="260" height="96" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2.5"/>
    <text x="1020" y="560" fill="#334155">deprecated</text>
    <text x="1020" y="588" font-size="15" font-weight="400" fill="#475569">final · file kept for history</text>
  </g>
  <g stroke-width="3" fill="none">
    <line x1="312" y1="568" x2="466" y2="568" stroke="#15803d" marker-end="url(#g)"/>
    <line x1="732" y1="568" x2="886" y2="568" stroke="#475569" marker-end="url(#a)"/>
  </g>
  <text x="389" y="552" text-anchor="middle" font-size="16" font-weight="600" fill="#15803d">verify</text>
  <text x="809" y="552" text-anchor="middle" font-size="16" font-weight="600" fill="#475569">deprecate</text>
  <path d="M180 620 V656 H1020 V620" stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <text x="600" y="643" text-anchor="middle" font-size="14" fill="#64748b" style="paint-order:stroke" stroke="#fff" stroke-width="8">a draft can also be deprecated directly</text>
</svg>
