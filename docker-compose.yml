name: cardloom-mcp

services:
  cardloom-mcp:
    build: .
    stdin_open: true
    volumes:
      - ./knowledge-store:/data/knowledge-store
      - cardloom-metadata:/data/metadata
    environment:
      - KNOWLEDGE_STORE_PATH=/data/knowledge-store
      - INDEX_DB_PATH=/data/metadata/index.db
      - REVIEWER_NAME=${REVIEWER_NAME:-human-reviewer}
      # Opt-in search telemetry for `gaps`: OFF unless CARDLOOM_TELEMETRY=local. Written to
      # /data/metadata/telemetry.jsonl (the named volume, mode 0600); the server refuses to write inside the
      # knowledge store. Samples (the text of unanswered searches; the secret scan catches common credential
      # formats only) are a separate opt-in: CARDLOOM_TELEMETRY_SAMPLES=1.
      - CARDLOOM_TELEMETRY=${CARDLOOM_TELEMETRY:-off}
      - CARDLOOM_TELEMETRY_SAMPLES=${CARDLOOM_TELEMETRY_SAMPLES:-0}

  cardloom-web:
    build: .
    ports:
      - "127.0.0.1:3334:3334"
    volumes:
      - ./knowledge-store:/data/knowledge-store
      - cardloom-metadata:/data/metadata
    environment:
      - KNOWLEDGE_STORE_PATH=/data/knowledge-store
      - INDEX_DB_PATH=/data/metadata/index.db
      - REVIEWER_NAME=${REVIEWER_NAME:-human-reviewer}
      - PORT=3334
      - RUNNING_IN_DOCKER=true
      - GRAPH_GENERIC_STACK_TAGS=${GRAPH_GENERIC_STACK_TAGS:-}
      - MAX_SHARED_STACK_GROUP_SIZE=${MAX_SHARED_STACK_GROUP_SIZE:-50}
      - MAX_SHARED_STACK_EDGES=${MAX_SHARED_STACK_EDGES:-5000}
    command: ["node", "dist/web/server.js"]

volumes:
  cardloom-metadata:
